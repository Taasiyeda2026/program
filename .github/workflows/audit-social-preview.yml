name: Audit live social previews
on:
  push:
    branches: [audit-social-preview-live]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import urllib.request,urllib.error,re
          from pathlib import Path
          from html.parser import HTMLParser
          class Meta(HTMLParser):
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if t=='meta' and (d.get('property','').startswith('og:') or d.get('name')=='robots'): print(d)
          for path in ('/stem/esraa/','/stem/esraa/?preview=3','/workshops/share/','/space/esraa/','/workshops/assets/catalog-stem-cover.jpg?v=2','/workshops/assets/catalog-stem-cover.jpg'):
              for ua in ('WhatsApp/2.24.1','facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)'):
                  try:
                      req=urllib.request.Request('https://taasiyeda.work'+path,headers={'User-Agent':ua})
                      with urllib.request.urlopen(req,timeout=12) as r:
                          b=r.read()
                          print(path,ua,r.status,r.url,r.headers.get('Content-Type'),len(b), 'robots',r.headers.get('X-Robots-Tag'))
                          if 'html' in r.headers.get('Content-Type',''): Meta().feed(b.decode('utf-8','replace'))
                  except Exception as e: print(path,ua,type(e).__name__,str(e))
          PY
