name: Normalize catalog card images
on:
  push:
    branches: [catalog-card-image-polish]
    paths: ['.github/workflows/normalize-catalog-cards.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.1.1
      - run: python space-workshops/tools/normalize_card_images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add space-workshops/images/cards
          git commit -m "Add 45 normalized square product card thumbnails"
          git pull --rebase origin catalog-card-image-polish
          git push origin HEAD:catalog-card-image-polish
